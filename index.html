<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    
    <title>Aethelgard RPG</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #e0e0e0; font-family: monospace; padding: 15px; height: 100vh; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        h2 { font-size: 18px; color: #fff; letter-spacing: 1px; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .user-tag { font-size: 11px; color: #888; }
        
        .btn-action { font-size: 11px; padding: 4px 8px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
        .btn-action:hover { background: #333; color: #fff; }
        .btn-reset:hover { background: #331111; color: #ff6666; border-color: #aa3333; }
        
        #chat { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 15px; margin-bottom: 15px; background: #1a1a1a; border-radius: 8px; }
        .user-msg { color: #4caf50; margin-bottom: 15px; border-left: 3px solid #4caf50; padding-left: 10px; }
        .ia-msg { color: #ff9800; margin-bottom: 15px; border-left: 3px solid #ff9800; padding-left: 10px; line-height: 1.6; }
        .system-msg { color: #888; font-style: italic; margin-bottom: 15px; }
        .badge-modelo { font-size: 10px; background: #333; color: #aaa; padding: 2px 5px; border-radius: 4px; margin-left: 8px; vertical-align: middle; border: 1px solid #555; }
        .npc-toast { font-size: 11px; color: #64b5f6; margin-bottom: 10px; padding: 4px 8px; background: #0d2238; border-left: 3px solid #2196f3; border-radius: 4px; }
        
        .painel-central { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; gap: 15px; padding: 20px; }
        .painel-central p { color: #aaa; font-size: 14px; line-height: 1.5; max-width: 400px; }
        
        .btn-google { padding: 12px 20px; background: #ffffff; color: #121212; font-weight: bold; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .btn-google:hover { background: #e0e0e0; }

        .btn-iniciar { padding: 16px 28px; background: #8b0000; color: #fff; font-weight: bold; border: 1px solid #ff4444; border-radius: 8px; font-size: 16px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        .btn-iniciar:active { background: #660000; }

        .input-area { display: flex; gap: 10px; padding-bottom: 10px; }
        input { flex: 1; padding: 15px; background: #222; color: white; border: 1px solid #444; border-radius: 8px; font-family: inherit; font-size: 16px; outline: none; }
        input:disabled { background: #181818; color: #555; border-color: #2a2a2a; }
        button.btn-enviar { padding: 15px 20px; cursor: pointer; background: #4caf50; color: black; font-weight: bold; border: none; border-radius: 8px; font-size: 16px; white-space: nowrap; }
        button.btn-enviar:disabled { background: #333; color: #666; cursor: not-allowed; }

        /* Abas do Modal */
        .modal-tabs { display: flex; gap: 6px; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .tab-btn { flex: 1; padding: 6px; background: #141414; color: #888; border: 1px solid #333; border-radius: 4px; font-family: inherit; font-size: 12px; cursor: pointer; }
        .tab-btn.active { background: #2c2c2c; color: #ff9800; border-color: #ff9800; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Aethelgard RPG</h2>
        <div class="header-actions" id="header-actions" style="display: none;">
            <span class="user-tag" id="user-display"></span>
            <button class="btn-action" onclick="toggleMochila()">🎒 Diário</button>
            <button class="btn-action btn-reset" onclick="reiniciarCampanha()">Resetar</button>
            <button class="btn-action" onclick="fazerLogout()">Sair</button>
        </div>
    </div>
    
    <div id="chat">
        <div class="painel-central" id="painel-login">
            <h3 style="color: #ff4444;">Portões de Aethelgard</h3>
            <p>Identifique-se antes de adentrar as terras sombrias.</p>
            <button class="btn-google" onclick="fazerLogin()">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                Entrar com Google
            </button>
        </div>
    </div>
    
    <div class="input-area">
        <input type="text" id="mensagem" placeholder="Identifique-se para jogar..." disabled onkeypress="if(event.key === 'Enter') enviarMensagem()">
        <button class="btn-enviar" id="btn-enviar" disabled onclick="enviarMensagem()">Ação</button>
    </div>

    <!-- Modal de Diário (Ficha, Mochila e Mundo/NPCs) -->
    <div id="modal-mochila" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:999; justify-content:center; align-items:center; padding:15px;">
        <div style="background:#1e1e1e; border:1px solid #444; border-radius:8px; width:100%; max-width:460px; max-height:85vh; display:flex; flex-direction:column; padding:15px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h3 style="color:#ff9800; font-size:16px;">📖 Diário de Campanha</h3>
                <button class="btn-action" onclick="toggleMochila()">✕ Fechar</button>
            </div>
            <div class="modal-tabs">
                <button class="tab-btn active" id="tab-heroi" onclick="mudarAbaModal('heroi')">👤 Herói</button>
                <button class="tab-btn" id="tab-mochila" onclick="mudarAbaModal('mochila')">🎒 Mochila</button>
                <button class="tab-btn" id="tab-mundo" onclick="mudarAbaModal('mundo')">🌍 Mundo & NPCs</button>
            </div>
            <div id="conteudo-mochila" style="overflow-y:auto; flex:1; font-size:13px; line-height:1.5;">
                <!-- Renderizado dinamicamente -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA-O5ZLR_eBHV4EdwYbaf6R_ua3xrbshEY",
            authDomain: "tavern-rpg-567f2.firebaseapp.com",
            projectId: "tavern-rpg-567f2",
            storageBucket: "tavern-rpg-567f2.firebasestorage.app",
            messagingSenderId: "975518537075",
            appId: "1:975518537075:web:8905162af19318f13a2106"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let usuarioAtual = null;
        let historicoChat = [];
        let statusJogador = null;
        let inventario = [];
        let estadoMundo = { local_atual: "Desconhecido", tempo_clima: "Incerto", fatos_mundo: [] };
        let npcsCache = [];
        let abaAtualModal = 'heroi';
        let processandoTurno = false;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                usuarioAtual = user;
                document.getElementById('header-actions').style.display = 'flex';
                document.getElementById('user-display').innerText = user.displayName?.split(' ')[0] || "Viajante";
                await carregarCampanhaDoUsuario();
            } else {
                usuarioAtual = null;
                limparEstadoLocal();
                document.getElementById('header-actions').style.display = 'none';
                bloquearChat("Identifique-se para jogar...");
                mostrarTelaLogin();
            }
        });

        function limparEstadoLocal() {
            historicoChat = [];
            statusJogador = null;
            inventario = [];
            estadoMundo = { local_atual: "Desconhecido", tempo_clima: "Incerto", fatos_mundo: [] };
            npcsCache = [];
            processandoTurno = false;
        }

        window.fazerLogin = async function() {
            try {
                await signInWithPopup(auth, provider);
            } catch (e) {
                alert("Erro ao logar com Google: " + e.message);
            }
        };

        window.fazerLogout = async function() {
            await signOut(auth);
        };

        function getCampanhaDocRef() {
            return doc(db, "usuarios", usuarioAtual.uid, "campanhas", "principal");
        }

        function getNpcsCollectionRef() {
            return collection(db, "usuarios", usuarioAtual.uid, "campanhas", "principal", "npcs");
        }

        async function obterNpcsConhecidos() {
            if (!usuarioAtual) return [];
            try {
                const snapshot = await getDocs(getNpcsCollectionRef());
                const npcs = [];
                snapshot.forEach(docSnap => npcs.push(docSnap.data()));
                npcsCache = npcs;
                return npcs;
            } catch (e) {
                console.warn("Erro ao buscar NPCs:", e);
                return npcsCache;
            }
        }

        async function salvarOuAtualizarListaNpcs(listaNpcs) {
            if (!usuarioAtual || !Array.isArray(listaNpcs) || listaNpcs.length === 0) return;

            for (const npcNovo of listaNpcs) {
                if (!npcNovo || !npcNovo.nome) continue;
                try {
                    const uid = usuarioAtual.uid;

                    // Busca se já existe pelo ID OU pelo Nome exato (evita duplicar Borin, Oldrik, etc.)
                    const nomeNovoLimpo = npcNovo.nome.trim().toLowerCase();
                    const npcExistente = npcsCache.find(n => 
                        (npcNovo.id && n.id === npcNovo.id) || 
                        (n.nome && n.nome.trim().toLowerCase() === nomeNovoLimpo)
                    ) || {};

                    // Mantém o ID original do banco para não criar documento órfão
                    const idFinal = npcExistente.id || npcNovo.id || nomeNovoLimpo.replace(/\s+/g, '_');
                    
                    const relacoesAntigas = npcExistente.relacoes_jogadores || {};
                    const relacaoJogadorAntiga = relacoesAntigas[uid] || { pontos: 0, como_enxerga: "Desconhecido", historico: [] };
                    const relacaoJogadorNova = (npcNovo.relacoes_jogadores && npcNovo.relacoes_jogadores[uid]) || {};

                    const historicoCumulativo = Array.isArray(relacaoJogadorAntiga.historico) 
                        ? [...relacaoJogadorAntiga.historico] 
                        : [];

                    const fatoNovo = relacaoJogadorNova.nova_memoria || relacaoJogadorNova.ultimo_fato;
                    if (fatoNovo && !historicoCumulativo.includes(fatoNovo)) {
                        historicoCumulativo.push(fatoNovo);
                        if (historicoCumulativo.length > 25) historicoCumulativo.shift();
                    }

                    const npcConsolidado = {
                        id: idFinal,
                        nome: npcNovo.nome || npcExistente.nome || "Desconhecido",
                        idade: npcExistente.idade || npcNovo.idade || null,
                        aparencia: npcExistente.aparencia || npcNovo.aparencia || "",
                        personalidade: npcExistente.personalidade || npcNovo.personalidade || "",
                        local_atual: npcNovo.local_atual || npcExistente.local_atual || "Desconhecido",
                        status_vida: npcNovo.status_vida || npcExistente.status_vida || "Ativo",
                        relacoes_jogadores: {
                            ...relacoesAntigas,
                            [uid]: {
                                pontos: relacaoJogadorNova.pontos !== undefined ? Number(relacaoJogadorNova.pontos) : relacaoJogadorAntiga.pontos,
                                como_enxerga: relacaoJogadorNova.como_enxerga || relacaoJogadorAntiga.como_enxerga,
                                historico: historicoCumulativo
                            }
                        }
                    };

                    const npcRef = doc(db, "usuarios", uid, "campanhas", "principal", "npcs", idFinal);
                    await setDoc(npcRef, npcConsolidado, { merge: true });

                    const idx = npcsCache.findIndex(n => n.id === idFinal);
                    if (idx >= 0) npcsCache[idx] = npcConsolidado;
                    else npcsCache.push(npcConsolidado);

                    adicionarAvisoNpc(`Memória consolidada: ${npcConsolidado.nome}`);
                } catch (e) {
                    console.error("Erro ao salvar NPC:", e);
                }
            }
        }

        window.limparNpcsDuplicados = async function() {
            if (!usuarioAtual || npcsCache.length === 0) return;
            const vistos = new Map();
            const paraDeletar = [];

            npcsCache.forEach(npc => {
                const chave = npc.nome.trim().toLowerCase();
                if (vistos.has(chave)) {
                    // Mantém o que tiver mais histórico ou afinidade mais recente
                    paraDeletar.push(npc.id);
                } else {
                    vistos.set(chave, npc.id);
                }
            });

            if (paraDeletar.length === 0) {
                alert("Nenhum NPC duplicado encontrado.");
                return;
            }

            for (const id of paraDeletar) {
                const ref = doc(db, "usuarios", usuarioAtual.uid, "campanhas", "principal", "npcs", id);
                await deleteDoc(ref);
            }

            await obterNpcsConhecidos();
            renderizarMochila();
            alert(`Foram fundidos/removidos ${paraDeletar.length} registros duplicados.`);
        };
        
        async function carregarCampanhaDoUsuario() {
            const chat = document.getElementById('chat');
            chat.innerHTML = "<div class='painel-central'><p>Consultando registros arcanos...</p></div>";

            try {
                const [docSnap] = await Promise.all([
                    getDoc(getCampanhaDocRef()),
                    obterNpcsConhecidos()
                ]);

                if (docSnap.exists() && docSnap.data().historico && docSnap.data().historico.length > 0) {
                    const dados = docSnap.data();
                    historicoChat = dados.historico;
                    statusJogador = dados.status_jogador || null;
                    inventario = dados.inventario || [];
                    estadoMundo = dados.estado_mundo || { local_atual: "Desconhecido", tempo_clima: "Incerto", fatos_mundo: [] };

                    liberarChat();
                    chat.innerHTML = "";
                    historicoChat.forEach(msg => {
                        const remetente = msg.role === 'user' ? 'Você' : 'Mestre';
                        const classe = msg.role === 'user' ? 'user-msg' : 'ia-msg';
                        adicionarNaTelaDireto(remetente, msg.parts[0].text, classe);
                    });
                } else {
                    mostrarTelaNovoJogo();
                }
            } catch (e) {
                console.error("Erro ao carregar do Firestore:", e);
                chat.innerHTML = `<div class='painel-central'><p style='color:red;'>Erro ao carregar: ${e.message}</p></div>`;
            }
        }

        function mostrarTelaLogin() {
            const chat = document.getElementById('chat');
            chat.innerHTML = `
                <div class="painel-central">
                    <h3 style="color: #ff4444;">Portões de Aethelgard</h3>
                    <p>Identifique-se antes de adentrar as terras sombrias.</p>
                    <button class="btn-google" onclick="fazerLogin()">
                        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                        Entrar com Google
                    </button>
                </div>
            `;
        }

        function mostrarTelaNovoJogo() {
            limparEstadoLocal();
            const chat = document.getElementById('chat');
            chat.innerHTML = `
                <div class="painel-central">
                    <h3 style="color: #ff4444;">Nenhuma Campanha Ativa</h3>
                    <p>O continente de Aethelgard aguarda a sua sentença. Quando estiver pronto para aceitar o peso deste mundo, dê o chamado.</p>
                    <button class="btn-iniciar" onclick="iniciarCampanha()">Despertar em Aethelgard</button>
                </div>
            `;
            bloquearChat("Aguardando início da campanha...");
        }

        async function salvarJogo() {
            if (!usuarioAtual) return;
            try {
                const LIMITE_FIRESTORE = 60;
                if (historicoChat.length > LIMITE_FIRESTORE) {
                    historicoChat = historicoChat.slice(-LIMITE_FIRESTORE);
                    while (historicoChat.length > 0 && historicoChat[0].role !== 'user') {
                        historicoChat.shift();
                    }
                }

                await setDoc(getCampanhaDocRef(), {
                    historico: historicoChat,
                    status_jogador: statusJogador,
                    inventario: inventario,
                    estado_mundo: estadoMundo,
                    atualizadoEm: new Date(),
                    jogadorNome: usuarioAtual.displayName,
                    jogadorEmail: usuarioAtual.email
                });
            } catch (e) {
                console.error("Erro ao salvar no Firebase:", e);
            }
        }

        function liberarChat() {
            const input = document.getElementById('mensagem');
            input.disabled = false;
            input.placeholder = "Declare sua ação imediata...";
            document.getElementById('btn-enviar').disabled = false;
            input.focus();
        }

        function bloquearChat(placeholder) {
            document.getElementById('mensagem').disabled = true;
            document.getElementById('mensagem').placeholder = placeholder;
            document.getElementById('btn-enviar').disabled = true;
        }

        window.iniciarCampanha = async function() {
            if (processandoTurno) return;
            const chat = document.getElementById('chat');
            chat.innerHTML = "";
            adicionarNaTela('Sistema', 'Despertando em Aethelgard...', 'system-msg', true);

            const promptInicio = "Inicie a campanha de Aethelgard. Dê as boas-vindas sombrias ao mundo e exija minhas 4 definições iniciais para a ficha: Nome, Raça, Classe (D&D 5E) e a minha Anomalia (um item pessoal, tático ou tecnológico trazido do outro mundo, de uso individual e sem impacto em escala de destruição em massa).";
            
            historicoChat.push({
                "role": "user",
                "parts": [{ "text": promptInicio }]
            });

            await processarTurnoComServidor(false);
        };

        window.enviarMensagem = async function() {
            if (processandoTurno) return;
            const input = document.getElementById('mensagem');
            const textoUsuario = input.value.trim();
            if (!textoUsuario) return;

            adicionarNaTela('Você', textoUsuario, 'user-msg');
            input.value = ''; 

            historicoChat.push({
                "role": "user",
                "parts": [{ "text": textoUsuario }]
            });

            adicionarNaTela('Sistema', 'Aguardando o destino...', 'system-msg', true);
            await processarTurnoComServidor(true);
        };

        async function processarTurnoComServidor(reverterHistoricoSeFalhar = false) {
            processandoTurno = true;
            bloquearChat("O Mestre está julgando sua ação...");

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        historicoChat: historicoChat,
                        userId: usuarioAtual.uid,
                        npcsConhecidos: npcsCache,
                        statusJogador: statusJogador,
                        inventario: inventario,
                        estadoMundo: estadoMundo
                    })
                });

                const data = await response.json();
                removerCarregando();

                if (!response.ok) throw new Error(data.error || "A magia falhou no servidor.");

                adicionarNaTela('Mestre', data.texto, 'ia-msg', false, data.modelo);
                
                historicoChat.push({
                    "role": "model",
                    "parts": [{ "text": data.texto }]
                });

                if (data.estadoInicial) {
                    statusJogador = data.estadoInicial.status_jogador || statusJogador;
                    if (statusJogador && !Array.isArray(statusJogador.marcos_e_vinculos)) {
                        statusJogador.marcos_e_vinculos = [];
                    }
                    inventario = data.estadoInicial.inventario || [];
                    if (data.estadoInicial.estado_mundo) {
                        estadoMundo = data.estadoInicial.estado_mundo;
                    }
                }

                if (data.estadoAtualizado) {
                    aplicarAtualizacaoEstado(data.estadoAtualizado);
                }

                if (data.npcsAtualizados && data.npcsAtualizados.length > 0) {
                    await salvarOuAtualizarListaNpcs(data.npcsAtualizados);
                }

                await salvarJogo();

            } catch (error) {
                removerCarregando();
                if (reverterHistoricoSeFalhar) historicoChat.pop();
                adicionarNaTela('Alerta', error.message, 'system-msg');
            } finally {
                processandoTurno = false;
                liberarChat();
            }
        }

        window.reiniciarCampanha = async function() {
            if (!confirm("Tem certeza que deseja apagar essa campanha e recomeçar do zero? Os NPCs e vínculos esquecerão tudo.")) return;
            try {
                const npcsSnapshot = await getDocs(getNpcsCollectionRef());
                const promessasDelecao = [];
                npcsSnapshot.forEach((docNpc) => {
                    promessasDelecao.push(deleteDoc(docNpc.ref));
                });
                await Promise.all(promessasDelecao);

                await deleteDoc(getCampanhaDocRef());
                mostrarTelaNovoJogo();
            } catch (e) {
                alert("Erro ao resetar: " + e.message);
            }
        };

        function aplicarAtualizacaoEstado(mod) {
            if (!statusJogador) return;

            if (mod.novo_nivel) statusJogador.nivel = mod.novo_nivel;
            if (mod.nova_ca) statusJogador.ca = mod.nova_ca;
            if (mod.novo_hp_max) statusJogador.hp_max = mod.novo_hp_max;

            if (mod.dano_sofrido) {
                statusJogador.hp_atual = Math.max(0, statusJogador.hp_atual - Number(mod.dano_sofrido));
            }
            if (mod.cura_recebida) {
                statusJogador.hp_atual = Math.min(statusJogador.hp_max, statusJogador.hp_atual + Number(mod.cura_recebida));
            }

            if (!Array.isArray(statusJogador.condicoes)) statusJogador.condicoes = [];
            if (Array.isArray(mod.novas_condicoes)) {
                mod.novas_condicoes.forEach(c => {
                    if (c && !statusJogador.condicoes.includes(c)) statusJogador.condicoes.push(c);
                });
            }
            if (Array.isArray(mod.remover_condicoes)) {
                statusJogador.condicoes = statusJogador.condicoes.filter(c => !mod.remover_condicoes.includes(c));
            }

            if (!Array.isArray(statusJogador.marcos_e_vinculos)) statusJogador.marcos_e_vinculos = [];
            if (Array.isArray(mod.novos_marcos_personagem)) {
                mod.novos_marcos_personagem.forEach(m => {
                    if (m && !statusJogador.marcos_e_vinculos.includes(m)) {
                        statusJogador.marcos_e_vinculos.push(m);
                    }
                });
            }
            if (Array.isArray(mod.remover_marcos_personagem)) {
                statusJogador.marcos_e_vinculos = statusJogador.marcos_e_vinculos.filter(m => !mod.remover_marcos_personagem.includes(m));
            }

            if (mod.novo_local) estadoMundo.local_atual = mod.novo_local;
            if (mod.novo_tempo_clima) estadoMundo.tempo_clima = mod.novo_tempo_clima;
            if (!Array.isArray(estadoMundo.fatos_mundo)) estadoMundo.fatos_mundo = [];
            if (Array.isArray(mod.novos_fatos_mundo)) {
                mod.novos_fatos_mundo.forEach(f => {
                    if (f && !estadoMundo.fatos_mundo.includes(f)) estadoMundo.fatos_mundo.push(f);
                });
            }
            if (Array.isArray(mod.remover_fatos_mundo)) {
                estadoMundo.fatos_mundo = estadoMundo.fatos_mundo.filter(f => !mod.remover_fatos_mundo.includes(f));
            }

            // Reconstrução completa da mochila quando acionado pelo botão Sincronizar
            if (Array.isArray(mod.sincronizar_inventario) && mod.sincronizar_inventario.length > 0) {
                inventario = mod.sincronizar_inventario.map(item => ({
                    id: item.id || (item.nome || 'item').toLowerCase().replace(/\s+/g, '_'),
                    nome: item.nome || item.id,
                    tipo: item.tipo || 'item',
                    qtd: item.qtd !== undefined ? Number(item.qtd) : 1,
                    ...(item.municao !== undefined && item.municao !== null ? { municao: Number(item.municao) } : {}),
                    detalhes: item.detalhes || '',
                    observacao: item.observacao || ''
                }));
                return;
            }

            // Desconto de itens, ajuste direto ou recriação automática se o item tinha sumido
            if (Array.isArray(mod.itens_gastos)) {
                mod.itens_gastos.forEach(gasto => {
                    const item = inventario.find(i => 
                        (i.id && gasto.id && i.id.toLowerCase() === gasto.id.toLowerCase()) ||
                        (i.nome && gasto.id && i.nome.toLowerCase() === gasto.id.toLowerCase()) ||
                        (i.nome && gasto.nome && i.nome.toLowerCase() === gasto.nome.toLowerCase())
                    );

                    if (item) {
                        if (gasto.nova_municao !== undefined && gasto.nova_municao !== null) {
                            item.municao = Number(gasto.nova_municao);
                        } else if (gasto.qtd_municao_gasta && item.municao !== undefined) {
                            item.municao = Math.max(0, item.municao - Number(gasto.qtd_municao_gasta));
                        }

                        if (gasto.qtd_restante !== undefined && gasto.qtd_restante !== null) {
                            item.qtd = Number(gasto.qtd_restante);
                        } else if (gasto.nova_qtd !== undefined && gasto.nova_qtd !== null && Number(gasto.nova_qtd) > 0) {
                            item.qtd = Number(gasto.nova_qtd);
                        } else if (gasto.qtd_gasta && item.qtd !== undefined) {
                            item.qtd -= Number(gasto.qtd_gasta);
                        }
                    } else if (gasto.qtd_restante !== undefined && Number(gasto.qtd_restante) > 0) {
                        inventario.push({
                            id: gasto.id || (gasto.nome || 'item').toLowerCase().replace(/\s+/g, '_'),
                            nome: gasto.nome || gasto.id,
                            tipo: 'item',
                            qtd: Number(gasto.qtd_restante),
                            detalhes: gasto.detalhes || ''
                        });
                    }
                });
                inventario = inventario.filter(i => i.tipo === 'anomalia' || i.qtd === undefined || i.qtd > 0);
            }

            if (Array.isArray(mod.itens_ganhos)) {
                mod.itens_ganhos.forEach(novo => {
                    if (!novo || !novo.nome) return;
                    const existente = inventario.find(i => 
                        (i.id && novo.id && i.id.toLowerCase() === novo.id.toLowerCase()) ||
                        (i.nome.toLowerCase() === novo.nome.toLowerCase())
                    );
                    if (existente) {
                        if (novo.qtd !== undefined) existente.qtd = (existente.qtd || 1) + Number(novo.qtd);
                        if (novo.municao !== undefined && novo.municao !== null) existente.municao = Number(novo.municao);
                        if (novo.detalhes) existente.detalhes = novo.detalhes;
                    } else {
                        inventario.push({
                            id: novo.id || novo.nome.toLowerCase().replace(/\s+/g, '_'),
                            nome: novo.nome,
                            tipo: novo.tipo || 'item',
                            qtd: novo.qtd !== undefined ? Number(novo.qtd) : 1,
                            ...(novo.municao !== undefined && novo.municao !== null ? { municao: Number(novo.municao) } : {}),
                            detalhes: novo.detalhes || ''
                        });
                    }
                });
            }
            
            if (Array.isArray(mod.itens_observacao)) {
                mod.itens_observacao.forEach(obs => {
                    const item = inventario.find(i => 
                        (i.id && obs.id && i.id.toLowerCase() === obs.id.toLowerCase()) ||
                        (i.nome && obs.id && i.nome.toLowerCase() === obs.id.toLowerCase())
                    );
                    if (item) {
                        if (obs.observacao !== undefined) item.observacao = obs.observacao;
                        if (obs.nova_municao !== undefined && obs.nova_municao !== null) {
                            item.municao = Number(obs.nova_municao);
                        }
                    }
                });
            }
        }

        window.sincronizarMochilaComHistoria = async function() {
            toggleMochila();
            const input = document.getElementById('mensagem');
            input.value = "[SISTEMA]: Faça uma auditoria rápida do meu equipamento atual conforme a história: confirme no texto e preencha a chave 'sincronizar_inventario' no JSON com todos os itens, armas, casaco, besta, virotes exatos e munições que estão comigo agora.";
            await enviarMensagem();
        };

        window.toggleMochila = function() {
            const modal = document.getElementById('modal-mochila');
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                renderizarMochila();
                modal.style.display = 'flex';
            }
        };

        window.mudarAbaModal = function(aba) {
            abaAtualModal = aba;
            document.getElementById('tab-heroi').classList.toggle('active', aba === 'heroi');
            document.getElementById('tab-mochila').classList.toggle('active', aba === 'mochila');
            document.getElementById('tab-mundo').classList.toggle('active', aba === 'mundo');
            renderizarMochila();
        };

        function renderizarMochila() {
            const box = document.getElementById('conteudo-mochila');
            if (!statusJogador) {
                box.innerHTML = "<p style='color:#888;'>Ficha ainda não gerada nesta campanha.</p>";
                return;
            }

            if (abaAtualModal === 'heroi') {
                const atrib = statusJogador.atributos || {};
                const modAtrib = (val) => {
                    if (val === undefined) return '';
                    const m = Math.floor((val - 10) / 2);
                    return m >= 0 ? `+${m}` : `${m}`;
                };

                let atribHtml = '';
                if (Object.keys(atrib).length > 0) {
                    atribHtml = `
                        <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:6px; margin: 8px 0; text-align:center;">
                            ${Object.entries(atrib).map(([k, v]) => `
                                <div style="background:#141414; border:1px solid #333; padding:5px 2px; border-radius:4px;">
                                    <span style="font-size:10px; color:#888;">${k.toUpperCase()}</span><br>
                                    <strong style="color:#eee;">${v}</strong> <span style="font-size:10px; color:#4caf50;">(${modAtrib(v)})</span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                const marcos = statusJogador.marcos_e_vinculos || [];
                const marcosHtml = marcos.length > 0
                    ? marcos.map(m => `<li style="margin-bottom:4px; color:#ddd;">• ${m}</li>`).join('')
                    : `<li style="color:#666;">Nenhum vínculo ou marco registrado ainda.</li>`;

                box.innerHTML = `
                    <div style="background:#252525; padding:10px; border-radius:6px; margin-bottom:10px; border-left:3px solid #ff9800;">
                        <strong style="color:#4caf50; font-size:15px;">${statusJogador.nome || 'Viajante'}</strong><br>
                        <span style="color:#ccc;">${statusJogador.raca || ''} ${statusJogador.classe || ''} (Nível ${statusJogador.nivel || 1})</span><br>
                        <div style="margin-top:6px;">
                            <strong>HP:</strong> <span style="color:${statusJogador.hp_atual <= 3 ? '#ff4444' : '#4caf50'};">${statusJogador.hp_atual}/${statusJogador.hp_max}</span> | 
                            <strong>CA:</strong> ${statusJogador.ca || 10}
                        </div>
                        <div style="font-size:11px; color:#aaa; margin-top:4px;">
                            <strong>Condições Físicas:</strong> ${statusJogador.condicoes && statusJogador.condicoes.length > 0 ? statusJogador.condicoes.join(', ') : 'Nenhuma'}
                        </div>
                    </div>
                    ${atribHtml}
                    <h4 style="color:#ff9800; margin: 12px 0 6px 0; font-size:13px;">📜 Crônica, Títulos & Vínculos:</h4>
                    <ul style="list-style:none; padding:8px; background:#161616; border:1px solid #2c2c2c; border-radius:6px;">
                        ${marcosHtml}
                    </ul>
                `;
            } else if (abaAtualModal === 'mochila') {
                let itensHtml = inventario.map(i => {
                    // Sincroniza sempre o número de munição caso a nota informe X/Y tiros ou balas
                    if (i.observacao) {
                        const matchBalas = i.observacao.match(/(\d+)\s*(?:\/\s*\d+)?\s*(?:tiros?|balas?)/i);
                        if (matchBalas) {
                            i.municao = Number(matchBalas[1]);
                        }
                    }

                    return `
                        <li style="margin-bottom:8px; border-bottom:1px solid #2a2a2a; padding-bottom:6px;">
                            <strong style="color:#fff;">${i.nome}</strong> ${i.qtd ? `<span style="color:#4caf50;">(x${i.qtd})</span>` : ''} 
                            ${i.municao !== undefined ? `<span style="color:#64b5f6;">[Munição: ${i.municao}]</span>` : ''}
                            <br><span style="color:#888; font-size:11px;">${i.detalhes || ''}</span>
                            ${i.observacao ? `<br><span style="color:#ff9800; font-size:11px;">📌 <strong>Nota:</strong> ${i.observacao}</span>` : ''}
                        </li>
                    `;
                }).join('');

                box.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <h4 style="color:#aaa; font-size:13px;">Equipamento e Recursos:</h4>
                        <button class="btn-action" style="color:#64b5f6; border-color:#2196f3;" onclick="sincronizarMochilaComHistoria()">🔄 Sincronizar com a História</button>
                    </div>
                    <ul style="list-style:none; padding:0;">${itensHtml || '<li style="color:#666;">Mochila vazia.</li>'}</ul>
                `;
            } else if (abaAtualModal === 'mundo') {
                const fatos = estadoMundo.fatos_mundo || [];
                const fatosHtml = fatos.length > 0
                    ? fatos.map(f => `<li style="margin-bottom:4px; color:#ccc;">• ${f}</li>`).join('')
                    : `<li style="color:#666;">Nenhuma alteração drástica registrada ainda.</li>`;

                const uid = usuarioAtual?.uid;
                const npcsHtml = npcsCache.length > 0
                    ? npcsCache.map(n => {
                        const rel = (n.relacoes_jogadores && n.relacoes_jogadores[uid]) || { pontos: 0, como_enxerga: 'Indiferente', historico: [] };
                        const corPontos = rel.pontos > 10 ? '#4caf50' : (rel.pontos < -10 ? '#ff4444' : '#ff9800');
                        const ultimasMem = (rel.historico || []).slice(-3).map(h => `<div style="font-size:11px; color:#888;">- ${h}</div>`).join('');
                        return `
                            <div style="background:#161616; border:1px solid #2c2c2c; padding:8px; border-radius:6px; margin-bottom:8px;">
                                <div style="display:flex; justify-content:space-between;">
                                    <strong style="color:#64b5f6;">${n.nome}</strong>
                                    <span style="color:${corPontos}; font-weight:bold;">Afinidade: ${rel.pontos}</span>
                                </div>
                                <div style="font-size:11px; color:#aaa; margin:3px 0;">📍 ${n.local_atual || 'Desconhecido'} | ${n.status_vida || 'Ativo'}</div>
                                <div style="font-size:11px; color:#ddd; margin-bottom:4px;"><em>"${rel.como_enxerga || ''}"</em></div>
                                ${ultimasMem}
                            </div>
                        `;
                    }).join('')
                    : `<p style="color:#666;">Nenhum NPC registrado ainda.</p>`;

                box.innerHTML = `
                    <div style="background:#252525; padding:8px; border-radius:6px; margin-bottom:10px;">
                        <div><strong>📍 Local Atual:</strong> <span style="color:#ff9800;">${estadoMundo.local_atual || 'Desconhecido'}</span></div>
                        <div style="font-size:11px; color:#aaa; margin-top:4px;"><strong>⏳ Tempo/Clima:</strong> ${estadoMundo.tempo_clima || 'Incerto'}</div>
                    </div>
                    <h4 style="color:#aaa; margin:10px 0 6px 0; font-size:13px;">🔥 Fatos e Consequências no Mundo:</h4>
                    <ul style="list-style:none; padding:8px; background:#161616; border:1px solid #2c2c2c; border-radius:6px; margin-bottom:12px;">
                        ${fatosHtml}
                    </ul>
                    <h4 style="color:#aaa; margin:10px 0 6px 0; font-size:13px;">👥 NPCs Conhecidos (${npcsCache.length}):</h4>
                    <button class="btn-action" style="color:#ff9800; border-color:#ff9800;" onclick="limparNpcsDuplicados()">🧹 Unificar Duplicados</button>
                    ${npcsHtml}
                `;
            }
        }

        function adicionarAvisoNpc(texto) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'npc-toast';
            div.innerHTML = `👁️ ${texto}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function adicionarNaTela(remetente, texto, classe, isTemp = false, modeloBadge = null) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = classe;
            if (isTemp) div.id = "carregando-msg";
            
            const textoFormatado = texto.replace(/\n/g, '<br>');

            if (modeloBadge) {
                div.innerHTML = `<strong>${remetente}</strong><span class="badge-modelo">⚙️ ${modeloBadge}</span><br><br>${textoFormatado}`;
            } else {
                div.innerHTML = `<strong>${remetente}:</strong> ${textoFormatado}`;
            }
            
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight; 
        }

        function adicionarNaTelaDireto(remetente, texto, classe) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = classe;
            const textoFormatado = texto.replace(/\n/g, '<br>');
            div.innerHTML = `<strong>${remetente}:</strong> ${textoFormatado}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight; 
        }

        function removerCarregando() {
            const temp = document.getElementById('carregando-msg');
            if (temp) temp.remove();
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.error(err));
            });
        }
    </script>
</body>
