<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    
    <title>Aethelgard RPG</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #e0e0e0; font-family: monospace; padding: 15px; height: 100vh; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        h2 { font-size: 18px; color: #fff; letter-spacing: 1px; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .user-tag { font-size: 11px; color: #888; }
        
        .btn-action { font-size: 11px; padding: 4px 8px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
        .btn-action:hover { background: #333; color: #fff; }
        .btn-reset:hover { background: #331111; color: #ff6666; border-color: #aa3333; }
        
        #chat { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 15px; margin-bottom: 15px; background: #1a1a1a; border-radius: 8px; }
        .user-msg { color: #4caf50; margin-bottom: 15px; border-left: 3px solid #4caf50; padding-left: 10px; }
        .ia-msg { color: #ff9800; margin-bottom: 15px; border-left: 3px solid #ff9800; padding-left: 10px; line-height: 1.6; }
        .system-msg { color: #888; font-style: italic; margin-bottom: 15px; }
        .badge-modelo { font-size: 10px; background: #333; color: #aaa; padding: 2px 5px; border-radius: 4px; margin-left: 8px; vertical-align: middle; border: 1px solid #555; }
        .npc-toast { font-size: 11px; color: #64b5f6; margin-bottom: 10px; padding: 4px 8px; background: #0d2238; border-left: 3px solid #2196f3; border-radius: 4px; }
        
        .painel-central { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; gap: 15px; padding: 20px; }
        .painel-central p { color: #aaa; font-size: 14px; line-height: 1.5; max-width: 400px; }
        
        .btn-google { padding: 12px 20px; background: #ffffff; color: #121212; font-weight: bold; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .btn-google:hover { background: #e0e0e0; }

        .btn-iniciar { padding: 16px 28px; background: #8b0000; color: #fff; font-weight: bold; border: 1px solid #ff4444; border-radius: 8px; font-size: 16px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        .btn-iniciar:active { background: #660000; }

        .input-area { display: flex; gap: 10px; padding-bottom: 10px; }
        input { flex: 1; padding: 15px; background: #222; color: white; border: 1px solid #444; border-radius: 8px; font-family: inherit; font-size: 16px; outline: none; }
        button.btn-enviar { padding: 15px 20px; cursor: pointer; background: #4caf50; color: black; font-weight: bold; border: none; border-radius: 8px; font-size: 16px; white-space: nowrap; }
        button.btn-enviar:disabled { background: #333; color: #666; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Aethelgard RPG</h2>
        <div class="header-actions" id="header-actions" style="display: none;">
            <span class="user-tag" id="user-display"></span>
            <button class="btn-action btn-reset" onclick="reiniciarCampanha()">Resetar</button>
            <button class="btn-action" onclick="fazerLogout()">Sair</button>
        </div>
    </div>
    
    <div id="chat">
        <div class="painel-central" id="painel-login">
            <h3 style="color: #ff4444;">Portões de Aethelgard</h3>
            <p>Identifique-se antes de adentrar as terras sombrias.</p>
            <button class="btn-google" onclick="fazerLogin()">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                Entrar com Google
            </button>
        </div>
    </div>
    
    <div class="input-area">
        <input type="text" id="mensagem" placeholder="Identifique-se para jogar..." disabled onkeypress="if(event.key === 'Enter') enviarMensagem()">
        <button class="btn-enviar" id="btn-enviar" disabled onclick="enviarMensagem()">Ação</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA-O5ZLR_eBHV4EdwYbaf6R_ua3xrbshEY",
            authDomain: "tavern-rpg-567f2.firebaseapp.com",
            projectId: "tavern-rpg-567f2",
            storageBucket: "tavern-rpg-567f2.firebasestorage.app",
            messagingSenderId: "975518537075",
            appId: "1:975518537075:web:8905162af19318f13a2106"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let usuarioAtual = null;
        let historicoChat = [];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                usuarioAtual = user;
                document.getElementById('header-actions').style.display = 'flex';
                document.getElementById('user-display').innerText = user.displayName?.split(' ')[0] || "Viajante";
                await carregarCampanhaDoUsuario();
            } else {
                usuarioAtual = null;
                historicoChat = [];
                document.getElementById('header-actions').style.display = 'none';
                bloquearChat("Identifique-se para jogar...");
                mostrarTelaLogin();
            }
        });

        window.fazerLogin = async function() {
            try {
                await signInWithPopup(auth, provider);
            } catch (e) {
                alert("Erro ao logar com Google: " + e.message);
            }
        };

        window.fazerLogout = async function() {
            await signOut(auth);
        };

        function getCampanhaDocRef() {
            return doc(db, "usuarios", usuarioAtual.uid, "campanhas", "principal");
        }

        function getNpcsCollectionRef() {
            return collection(db, "usuarios", usuarioAtual.uid, "campanhas", "principal", "npcs");
        }

        // Puxa os NPCs já conhecidos da subcoleção
        async function obterNpcsConhecidos() {
            if (!usuarioAtual) return [];
            try {
                const snapshot = await getDocs(getNpcsCollectionRef());
                const npcs = [];
                snapshot.forEach(docSnap => npcs.push(docSnap.data()));
                return npcs;
            } catch (e) {
                console.warn("Erro ao buscar NPCs:", e);
                return [];
            }
        }

        // Salva ou atualiza um NPC na subcoleção
        async function salvarOuAtualizarNpc(npc) {
            if (!usuarioAtual || !npc || !npc.id) return;
            try {
                const npcRef = doc(db, "usuarios", usuarioAtual.uid, "campanhas", "principal", "npcs", npc.id);
                await setDoc(npcRef, npc, { merge: true });
                adicionarAvisoNpc(`Memória de NPC atualizada: ${npc.nome}`);
            } catch (e) {
                console.error("Erro ao salvar NPC:", e);
            }
        }

        async function carregarCampanhaDoUsuario() {
            const chat = document.getElementById('chat');
            chat.innerHTML = "<div class='painel-central'><p>Consultando registros arcanos...</p></div>";

            try {
                const docSnap = await getDoc(getCampanhaDocRef());

                if (docSnap.exists() && docSnap.data().historico && docSnap.data().historico.length > 0) {
                    historicoChat = docSnap.data().historico;
                    liberarChat();
                    chat.innerHTML = "";
                    historicoChat.forEach(msg => {
                        const remetente = msg.role === 'user' ? 'Você' : 'Mestre';
                        const classe = msg.role === 'user' ? 'user-msg' : 'ia-msg';
                        adicionarNaTelaDireto(remetente, msg.parts[0].text, classe);
                    });
                } else {
                    mostrarTelaNovoJogo();
                }
            } catch (e) {
                console.error("Erro ao carregar do Firestore:", e);
                chat.innerHTML = `<div class='painel-central'><p style='color:red;'>Erro ao carregar: ${e.message}</p></div>`;
            }
        }

        function mostrarTelaLogin() {
            const chat = document.getElementById('chat');
            chat.innerHTML = `
                <div class="painel-central">
                    <h3 style="color: #ff4444;">Portões de Aethelgard</h3>
                    <p>Identifique-se antes de adentrar as terras sombrias.</p>
                    <button class="btn-google" onclick="fazerLogin()">
                        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                        Entrar com Google
                    </button>
                </div>
            `;
        }

        function mostrarTelaNovoJogo() {
            const chat = document.getElementById('chat');
            chat.innerHTML = `
                <div class="painel-central">
                    <h3 style="color: #ff4444;">Nenhuma Campanha Ativa</h3>
                    <p>O continente de Aethelgard aguarda a sua sentença. Quando estiver pronto para aceitar o peso deste mundo, dê o chamado.</p>
                    <button class="btn-iniciar" onclick="iniciarCampanha()">Despertar em Aethelgard</button>
                </div>
            `;
            bloquearChat("Aguardando início da campanha...");
        }

        async function salvarJogo() {
            if (!usuarioAtual) return;
            try {
                await setDoc(getCampanhaDocRef(), {
                    historico: historicoChat,
                    atualizadoEm: new Date(),
                    jogadorNome: usuarioAtual.displayName,
                    jogadorEmail: usuarioAtual.email
                });
            } catch (e) {
                console.error("Erro ao salvar no Firebase:", e);
            }
        }

        function liberarChat() {
            document.getElementById('mensagem').disabled = false;
            document.getElementById('mensagem').placeholder = "O que você faz?";
            document.getElementById('btn-enviar').disabled = false;
        }

        function bloquearChat(placeholder) {
            document.getElementById('mensagem').disabled = true;
            document.getElementById('mensagem').placeholder = placeholder;
            document.getElementById('btn-enviar').disabled = true;
        }

        window.iniciarCampanha = async function() {
            const chat = document.getElementById('chat');
            chat.innerHTML = "";
            adicionarNaTela('Sistema', 'Despertando em Aethelgard...', 'system-msg', true);
            liberarChat();

            const promptInicio = "Inicie a campanha de Aethelgard. Dê as boas-vindas sombrias ao mundo e exija minhas 4 definições iniciais para a ficha: Nome, Raça, Classe (D&D 5E) e a minha Anomalia (um item pessoal, tático ou tecnológico trazido do outro mundo, de uso individual e sem impacto em escala de destruição em massa).";
            
            historicoChat.push({
                "role": "user",
                "parts": [{ "text": promptInicio }]
            });

            try {
                const npcsAtuais = await obterNpcsConhecidos();

                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        historicoChat: historicoChat,
                        userId: usuarioAtual.uid,
                        npcsConhecidos: npcsAtuais
                    })
                });

                const data = await response.json();
                removerCarregando();

                if (!response.ok) throw new Error(data.error || "O Mestre falhou.");

                adicionarNaTela('Mestre', data.texto, 'ia-msg', false, data.modelo);
                
                historicoChat.push({
                    "role": "model",
                    "parts": [{ "text": data.texto }]
                });

                if (data.npcAtualizado) {
                    await salvarOuAtualizarNpc(data.npcAtualizado);
                }

                await salvarJogo();
            } catch (error) {
                removerCarregando();
                adicionarNaTela('Erro', error.message, 'system-msg');
            }
        };

        window.reiniciarCampanha = async function() {
            if (!confirm("Tem certeza que deseja apagar essa campanha e recomeçar do zero? Os NPCs esquecerão tudo.")) return;
            try {
                // 1. Apaga todos os NPCs da subcoleção para não deixar rastros órfãos
                const npcsSnapshot = await getDocs(getNpcsCollectionRef());
                const promessasDelecao = [];
                npcsSnapshot.forEach((docNpc) => {
                    promessasDelecao.push(deleteDoc(docNpc.ref));
                });
                await Promise.all(promessasDelecao);
        
                // 2. Apaga o documento principal da campanha
                await deleteDoc(getCampanhaDocRef());
        
                // 3. Volta para a tela inicial de criação
                mostrarTelaNovoJogo();
            } catch (e) {
                alert("Erro ao resetar: " + e.message);
            }
        };

        window.enviarMensagem = async function() {
            const input = document.getElementById('mensagem');
            const textoUsuario = input.value.trim();
            if (!textoUsuario) return;

            adicionarNaTela('Você', textoUsuario, 'user-msg');
            input.value = ''; 

            historicoChat.push({
                "role": "user",
                "parts": [{ "text": textoUsuario }]
            });

            adicionarNaTela('Sistema', 'Aguardando o destino...', 'system-msg', true);

            try {
                const npcsAtuais = await obterNpcsConhecidos();

                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        historicoChat: historicoChat,
                        userId: usuarioAtual.uid,
                        npcsConhecidos: npcsAtuais
                    })
                });

                const data = await response.json();
                removerCarregando();

                if (!response.ok) throw new Error(data.error || "A magia falhou no servidor.");

                adicionarNaTela('Mestre', data.texto, 'ia-msg', false, data.modelo);
                
                historicoChat.push({
                    "role": "model",
                    "parts": [{ "text": data.texto }]
                });

                if (data.npcAtualizado) {
                    await salvarOuAtualizarNpc(data.npcAtualizado);
                }

                await salvarJogo();

            } catch (error) {
                removerCarregando();
                historicoChat.pop(); 
                adicionarNaTela('Alerta', error.message, 'system-msg');
            }
        };

        function adicionarAvisoNpc(texto) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'npc-toast';
            div.innerHTML = `👁️ ${texto}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function adicionarNaTela(remetente, texto, classe, isTemp = false, modeloBadge = null) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = classe;
            if (isTemp) div.id = "carregando-msg";
            
            const textoFormatado = texto.replace(/\n/g, '<br>');

            if (modeloBadge) {
                div.innerHTML = `<strong>${remetente}</strong><span class="badge-modelo">⚙️ ${modeloBadge}</span><br><br>${textoFormatado}`;
            } else {
                div.innerHTML = `<strong>${remetente}:</strong> ${textoFormatado}`;
            }
            
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight; 
        }

        function adicionarNaTelaDireto(remetente, texto, classe) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = classe;
            const textoFormatado = texto.replace(/\n/g, '<br>');
            div.innerHTML = `<strong>${remetente}:</strong> ${textoFormatado}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight; 
        }

        function removerCarregando() {
            const temp = document.getElementById('carregando-msg');
            if (temp) temp.remove();
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.error(err));
            });
        }
    </script>
</body>
</html>
